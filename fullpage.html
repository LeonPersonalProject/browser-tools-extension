<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开发者工具箱</title>
  <link rel="stylesheet" href="fullpage.css">
</head>
<body class="theme-dark">
  <div class="container">
    <!-- 头部 Logo 和设置 -->
    <div class="header">
      <div class="logo-section">
        <img src="assets/icon-128.png" alt="Logo" class="logo">
        <h1 class="title" id="page-title">开发者工具箱</h1>
      </div>

      <button class="settings-btn" id="settings-btn" title="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m0-6l4.2-4.2"></path>
        </svg>
      </button>
    </div>

    <!-- 主内容区域：左侧导航 + 右侧工具页面 -->
    <div class="main-content">
      <!-- 左侧工具导航 -->
      <nav class="tools-nav">
        <button class="tool-nav-item active" data-tool="json">
          <div class="tool-icon">📋</div>
          <div class="tool-info">
            <div class="tool-name">JSON</div>
            <div class="tool-desc">格式化与压缩</div>
          </div>
        </button>
        <button class="tool-nav-item" data-tool="timestamp">
          <div class="tool-icon">⏰</div>
          <div class="tool-info">
            <div class="tool-name">时间戳</div>
            <div class="tool-desc">时间转换</div>
          </div>
        </button>
        <button class="tool-nav-item" data-tool="encoder">
          <div class="tool-icon">🔐</div>
          <div class="tool-info">
            <div class="tool-name">编码</div>
            <div class="tool-desc">编码解码</div>
          </div>
        </button>
        <button class="tool-nav-item" data-tool="color">
          <div class="tool-icon">🎨</div>
          <div class="tool-info">
            <div class="tool-name">颜色</div>
            <div class="tool-desc">取色器</div>
          </div>
        </button>
        <button class="tool-nav-item" data-tool="converter">
          <div class="tool-icon">🔢</div>
          <div class="tool-info">
            <div class="tool-name">进制转换</div>
            <div class="tool-desc">进制互转</div>
          </div>
        </button>
        <button class="tool-nav-item tool-nav-item-placeholder" disabled>
          <div class="tool-icon">➕</div>
          <div class="tool-info">
            <div class="tool-name">更多</div>
            <div class="tool-desc">敬请期待</div>
          </div>
        </button>
      </nav>

      <!-- 右侧工具内容区域 -->
      <div class="tools-content">
        <!-- JSON 工具页面 -->
        <div class="page tool-page active" id="json-page">
          <div class="tool-content">
            <textarea id="json-input" placeholder="粘贴 JSON 字符串...&#10;支持 Python 字典格式（单引号、True/False/None）"></textarea>
            <div class="button-group">
              <button id="json-format">格式化</button>
              <button id="json-compress">压缩</button>
              <button id="json-copy" class="secondary-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                复制
              </button>
              <button id="json-clear" class="secondary-btn">清空</button>
            </div>
            <div id="json-error" class="error-msg"></div>
            <div id="json-output" class="output-box"></div>
          </div>
        </div>

        <!-- 时间戳工具页面 -->
        <div class="page tool-page" id="timestamp-page">
          <div class="tool-content">
            <div class="input-group">
              <label>时间戳（秒/毫秒）</label>
              <input type="text" id="timestamp-input" placeholder="输入时间戳">
              <button id="timestamp-now">当前时间</button>
            </div>
            <div class="input-group">
              <label>日期时间</label>
              <input type="text" id="datetime-input" placeholder="YYYY-MM-DD HH:mm:ss">
            </div>
            <div class="result-box">
              <div class="result-item">
                <span class="label">本地时间：</span>
                <span id="local-time" class="value">-</span>
              </div>
              <div class="result-item">
                <span class="label">UTC 时间：</span>
                <span id="utc-time" class="value">-</span>
              </div>
              <div class="result-item">
                <span class="label">秒时间戳：</span>
                <span id="timestamp-sec" class="value">-</span>
              </div>
              <div class="result-item">
                <span class="label">毫秒时间戳：</span>
                <span id="timestamp-ms" class="value">-</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 编码工具页面 -->
        <div class="page tool-page" id="encoder-page">
          <div class="tool-content">
            <div class="input-group">
              <label>编码类型</label>
              <select id="encode-type">
                <option value="base64">Base64</option>
                <option value="url">URL 编码</option>
                <option value="html">HTML 实体</option>
                <option value="unicode">Unicode 转义</option>
              </select>
            </div>
            <div class="encoder-container">
              <div class="encoder-side">
                <label>输入</label>
                <textarea id="encode-input" placeholder="输入要编码/解码的文本..."></textarea>
              </div>
              <div class="encoder-side">
                <label>输出</label>
                <textarea id="encode-output" readonly placeholder="结果将显示在这里..."></textarea>
              </div>
            </div>
            <div class="button-group">
              <button id="encode-btn">编码</button>
              <button id="decode-btn">解码</button>
              <button id="encode-clear">清空</button>
            </div>
            <div id="encode-error" class="error-msg"></div>
          </div>
        </div>

        <!-- 颜色工具页面 -->
        <div class="page tool-page" id="color-page">
          <div class="tool-content">
            <div class="color-tool-layout">
              <!-- 左侧：拾色器 -->
              <div class="color-picker-section">
                <div class="color-preview-wrapper">
                  <label>选择颜色</label>
                  <div class="color-preview" id="color-preview"></div>
                  <input type="color" id="color-input" value="#000000">
                </div>
                <div class="input-group">
                  <label>HEX 值</label>
                  <input type="text" id="hex-input" value="#000000">
                </div>
              </div>

              <!-- 右侧：结果和复制功能 -->
              <div class="color-results-section">
                <div class="color-formats">
                  <div class="format-item" data-copy="hex">
                    <span class="format-label">HEX:</span>
                    <span id="hex-value" class="format-value">#000000</span>
                  </div>
                  <div class="format-item" data-copy="rgb">
                    <span class="format-label">RGB:</span>
                    <span id="rgb-value" class="format-value">rgb(0, 0, 0)</span>
                  </div>
                  <div class="format-item" data-copy="hsl">
                    <span class="format-label">HSL:</span>
                    <span id="hsl-value" class="format-value">hsl(0, 0%, 0%)</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 进制转换工具页面 -->
        <div class="page tool-page" id="converter-page">
          <div class="tool-content">
            <div class="converter-input-section">
              <div class="input-group">
                <label>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                  输入数值
                </label>
                <input type="text" id="converter-input" placeholder="输入要转换的数值...">
              </div>
              <div class="input-group">
                <label>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                  输入进制
                </label>
                <div class="select-wrapper">
                  <select id="converter-from-base">
                    <option value="2">二进制 (Binary)</option>
                    <option value="8">八进制 (Octal)</option>
                    <option value="10" selected>十进制 (Decimal)</option>
                    <option value="16">十六进制 (Hexadecimal)</option>
                  </select>
                  <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>
              </div>
            </div>
            <div class="button-group">
              <button id="converter-convert">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="23 4 23 10 17 10"></polyline>
                  <polyline points="1 20 1 14 7 14"></polyline>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                转换
              </button>
              <button id="converter-clear" class="secondary-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                清空
              </button>
            </div>
            <div id="converter-error" class="error-msg"></div>
            <div class="converter-results-container">
              <div class="converter-result-item" data-base="binary">
                <div class="result-label">
                  <span class="result-icon">0b</span>
                  <span class="result-name">二进制</span>
                </div>
                <div class="result-value-wrapper">
                  <span id="converter-binary" class="result-value">-</span>
                </div>
              </div>
              <div class="converter-result-item" data-base="octal">
                <div class="result-label">
                  <span class="result-icon">0o</span>
                  <span class="result-name">八进制</span>
                </div>
                <div class="result-value-wrapper">
                  <span id="converter-octal" class="result-value">-</span>
                </div>
              </div>
              <div class="converter-result-item" data-base="decimal">
                <div class="result-label">
                  <span class="result-icon">10</span>
                  <span class="result-name">十进制</span>
                </div>
                <div class="result-value-wrapper">
                  <span id="converter-decimal" class="result-value">-</span>
                </div>
              </div>
              <div class="converter-result-item" data-base="hexadecimal">
                <div class="result-label">
                  <span class="result-icon">0x</span>
                  <span class="result-name">十六进制</span>
                </div>
                <div class="result-value-wrapper">
                  <span id="converter-hexadecimal" class="result-value">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <!-- 设置面板 -->
    <div id="settings-panel" class="settings-panel">
      <div class="settings-header">
        <h2>设置</h2>
        <button class="close-btn" id="close-settings">✕</button>
      </div>
      <div class="settings-content">
        <div class="setting-item">
          <div class="setting-label">
            <span>主题模式</span>
            <p class="setting-desc">切换浅色/深色主题</p>
          </div>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
