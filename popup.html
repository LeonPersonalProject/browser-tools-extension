<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开发者工具箱</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="theme-dark">
  <div class="container">
    <!-- 头部 Logo 和设置 -->
    <div class="header">
      <!-- 返回按钮（仅在工具页面显示） -->
      <button class="back-btn" id="back-btn" title="返回" style="display: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>

      <div class="logo-section">
        <img src="assets/icon-128.png" alt="Logo" class="logo">
        <h1 class="title" id="page-title">开发者工具箱</h1>
      </div>

      <button class="settings-btn" id="settings-btn" title="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m0-6l4.2-4.2"></path>
        </svg>
      </button>
    </div>

    <!-- 工具列表页面 -->
    <div class="page" id="tools-page">
      <div class="tools-grid">
        <button class="tool-card" data-tool="json">
          <div class="tool-icon">📋</div>
          <div class="tool-name">JSON</div>
          <div class="tool-desc">格式化与压缩</div>
        </button>
        <button class="tool-card" data-tool="timestamp">
          <div class="tool-icon">⏰</div>
          <div class="tool-name">时间戳</div>
          <div class="tool-desc">时间转换</div>
        </button>
        <button class="tool-card" data-tool="encoder">
          <div class="tool-icon">🔐</div>
          <div class="tool-name">编码</div>
          <div class="tool-desc">编码解码</div>
        </button>
        <button class="tool-card" data-tool="color">
          <div class="tool-icon">🎨</div>
          <div class="tool-name">颜色</div>
          <div class="tool-desc">取色器</div>
        </button>
        <button class="tool-card tool-card-placeholder">
          <div class="tool-icon">➕</div>
          <div class="tool-name">更多</div>
          <div class="tool-desc">敬请期待</div>
        </button>
      </div>
    </div>

    <!-- JSON 工具页面 -->
    <div class="page tool-page" id="json-page" style="display: none;">
      <div class="tool-content">
        <textarea id="json-input" placeholder="粘贴 JSON 字符串...&#10;支持 Python 字典格式（单引号、True/False/None）"></textarea>
        <div class="button-group">
          <button id="json-format">格式化</button>
          <button id="json-compress">压缩</button>
          <button id="json-copy" class="secondary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            复制
          </button>
          <button id="json-modal" class="secondary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
            大窗口
          </button>
          <button id="json-clear" class="secondary-btn">清空</button>
        </div>
        <div id="json-error" class="error-msg"></div>
        <div id="json-output" class="output-box"></div>
      </div>
    </div>

    <!-- 时间戳工具页面 -->
    <div class="page tool-page" id="timestamp-page" style="display: none;">
      <div class="tool-content">
        <div class="input-group">
          <label>时间戳（秒/毫秒）</label>
          <input type="text" id="timestamp-input" placeholder="输入时间戳">
          <button id="timestamp-now">当前时间</button>
        </div>
        <div class="input-group">
          <label>日期时间</label>
          <input type="text" id="datetime-input" placeholder="YYYY-MM-DD HH:mm:ss">
        </div>
        <div class="result-box">
          <div class="result-item">
            <span class="label">本地时间：</span>
            <span id="local-time" class="value">-</span>
          </div>
          <div class="result-item">
            <span class="label">UTC 时间：</span>
            <span id="utc-time" class="value">-</span>
          </div>
          <div class="result-item">
            <span class="label">秒时间戳：</span>
            <span id="timestamp-sec" class="value">-</span>
          </div>
          <div class="result-item">
            <span class="label">毫秒时间戳：</span>
            <span id="timestamp-ms" class="value">-</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 编码工具页面 -->
    <div class="page tool-page" id="encoder-page" style="display: none;">
      <div class="tool-content">
        <div class="input-group">
          <label>编码类型</label>
          <select id="encode-type">
            <option value="base64">Base64</option>
            <option value="url">URL 编码</option>
            <option value="html">HTML 实体</option>
            <option value="unicode">Unicode 转义</option>
          </select>
        </div>
        <div class="encoder-container">
          <div class="encoder-side">
            <label>输入</label>
            <textarea id="encode-input" placeholder="输入要编码/解码的文本..."></textarea>
          </div>
          <div class="encoder-side">
            <label>输出</label>
            <textarea id="encode-output" readonly placeholder="结果将显示在这里..."></textarea>
          </div>
        </div>
        <div class="button-group">
          <button id="encode-btn">编码</button>
          <button id="decode-btn">解码</button>
          <button id="encode-clear">清空</button>
        </div>
        <div id="encode-error" class="error-msg"></div>
      </div>
    </div>

    <!-- 颜色工具页面 -->
    <div class="page tool-page" id="color-page" style="display: none;">
      <div class="tool-content">
        <div class="color-picker-container">
          <div class="color-preview-wrapper">
            <label>选择颜色</label>
            <div class="color-preview" id="color-preview"></div>
            <input type="color" id="color-input" value="#000000">
          </div>
          <div class="input-group">
            <label>HEX 值</label>
            <input type="text" id="hex-input" value="#000000">
          </div>
        </div>
        <div class="color-formats">
          <div class="format-item" data-copy="hex">
            <span class="format-label">HEX:</span>
            <span id="hex-value" class="format-value">#000000</span>
          </div>
          <div class="format-item" data-copy="rgb">
            <span class="format-label">RGB:</span>
            <span id="rgb-value" class="format-value">rgb(0, 0, 0)</span>
          </div>
          <div class="format-item" data-copy="hsl">
            <span class="format-label">HSL:</span>
            <span id="hsl-value" class="format-value">hsl(0, 0%, 0%)</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <!-- 设置面板 -->
    <div id="settings-panel" class="settings-panel">
      <div class="settings-header">
        <h2>设置</h2>
        <button class="close-btn" id="close-settings">✕</button>
      </div>
      <div class="settings-content">
        <div class="setting-item">
          <div class="setting-label">
            <span>主题模式</span>
            <p class="setting-desc">切换浅色/深色主题</p>
          </div>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
